blockquote {

  margin: 1.5rem 2.5rem;
  padding: 0;
  
  /* No background colors, no shadows, no borders (printers didn't have CSS boxes!) */
  background: transparent;
  border: none;
  box-shadow: none;
  
  /* Traditional 18th-century typesetting shift: slightly smaller and italicized */
  font-size: 0.95rem;
  font-style: italic;
  line-height: 1.4;
  color: #3e3e3e;
}

/* If you have paragraphs inside the quote, give them traditional block indentation */
blockquote p {
  text-indent: 1.5rem; /* Early American printers loved paragraph indentation */
  margin: 0;
}

/* Remove indent on the very first paragraph if it flows directly from an intro */
blockquote p:first-child {
  text-indent: 0; 
}

/* Attribution / Sign-off styled like a classic printer's signature or source note */
blockquote cite {
  display: block;
  margin-top: 0.75rem;
  font-size: 0.85rem;
  font-style: normal;
  font-variant: small-caps;
  letter-spacing: 0.05em; /* Spacing out capitals gives it an antique press look */
  text-align: right;
  color: #593e44;
}
